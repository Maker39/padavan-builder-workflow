name: Build firmware

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.gitlab.com/hadzhioglu/padavan-ng
    defaults: { run: { shell: bash } }
    steps:
    - uses: actions/checkout@v4

    - name: Get variables
      run: |
        sed -i 's|\r$||g' variables build.config
        . <(cat variables build.config)
        PADAVAN_THEMES="${PADAVAN_THEMES[*]}"
        for v in "${!PADAVAN_@}" "${!CONFIG_@}"; do
          echo "$v=${!v}" >> $GITHUB_ENV
        done

    - name: Download sources and toolchain
      run: |
        git config --global --add safe.directory '*'
        git clone -b "$PADAVAN_BRANCH" "$PADAVAN_REPO"
        git -C padavan-ng checkout "$PADAVAN_COMMIT"
        wget -qO- "$PADAVAN_TOOLCHAIN_URL" | tar -C padavan-ng --zstd -xf -

    - name: Install themes
      run: |
        if [[ -n $PADAVAN_THEMES ]]; then
          git clone --depth 1 -b "$PADAVAN_THEMES_BRANCH" "$PADAVAN_THEMES_REPO" themes
          cp -r themes/common-theme themes/jquery.js padavan-ng/trunk/user/www/n56u_ribbon_fixed

          for theme in $PADAVAN_THEMES; do
            echo "Installing $theme theme"
            cp -r "themes/$theme-theme" padavan-ng/trunk/user/www/n56u_ribbon_fixed
          done
        fi

    - name: Run custom pre-build script
      run: '[[ -f pre-build.sh ]] && . pre-build.sh || :'

#  AI (рабочий вариант)
# Включение автоопределения памяти (как в OpenWrt)
# Мы модифицируем исходный код Kconfig и конфигурационные файлы платы WT3020H16M до сборки,
# заставляя ядро Padavan доверять загрузчику Breed.

    - name: Build firmware
      run: |
        sed -i 's/"//g' build.config
        cp build.config padavan-ng/trunk/.config
        cd padavan-ng/trunk

        BOARD_DIR="configs/boards/NEXX/WT3020H16M"
        TARGET_H="$BOARD_DIR/board.h"
        TARGET_MK="$BOARD_DIR/board.mk"

        echo "=== Настройка 128MB RAM ==="
        sed -i 's/CONFIG_RALINK_RAM_SIZE=64/# CONFIG_RALINK_RAM_SIZE is not set/g' $BOARD_DIR/kernel-3.4.x.config
        sed -i 's/CONFIG_RALINK_RAM_SIZE_FROM_BOOTLOADER=n/CONFIG_RALINK_RAM_SIZE_FROM_BOOTLOADER=y/g' $BOARD_DIR/kernel-3.4.x.config
        sed -i 's/CONFIG_RT2880_DRAM_64M=y/CONFIG_RT2880_DRAM_64M=n\nCONFIG_RT2880_DRAM_128M=y/g' $BOARD_DIR/kernel-3.4.x.config
        sed -i 's/DRAM_64M/DRAM_128M/g' $TARGET_H
        sed -i 's/RAM_SIZE=64/RAM_SIZE=128/g' $TARGET_MK

 
        echo "=== Настройка GPIO для Kimax (Режим Power/System LED) ==="
        sed -i 's/#define BOARD_NAME.*/#define BOARD_NAME "BS-U35-WF"/' $TARGET_H

        echo "=== Жесткий хардкод имени хоста в ядро Linux ==="
        # 1. Меняем дефолтную инициализацию hostname в исходном коде ядра Linux (версия 3.4.x)
        sed -i 's/#define UTS_NODENAME .*/#define UTS_NODENAME "BS-U35-WF"/' kernel/linux-3.4.x/include/generated/utsrelease.h 2>/dev/null || true
        sed -i 's/init_uts_ns.name.nodename.*/strcpy(init_uts_ns.name.nodename, "BS-U35-WF");/' kernel/linux-3.4.x/init/version.c

        # 2. Форсируем замену имени в NVRAM через Си-код инициализации системы
        sed -i '/int main(int argc, char \*\*argv)/a \    system("nvram set computer_name=BS-U35-WF");\n    system("nvram set router_model=BS-U35-WF");\n    system("nvram commit");' user/rc/rc.c

        # 3. Полная замена текстовых упоминаний во всех Си-файлах пространства пользователя
        find user/rc/ -type f -name "*.c" -exec sed -i 's/WT3020H16M/BS-U35-WF/g' {} +
        find user/httpd/ -type f -name "*.c" -exec sed -i 's/WT3020H16M/BS-U35-WF/g' {} +
        find user/shared/ -type f -name "*.c" -exec sed -i 's/WT3020H16M/BS-U35-WF/g' {} +



        #sed -i 's/#define BOARD_GPIO_LED_WIFI.*/#define BOARD_GPIO_LED_WIFI         72/' $TARGET_H
        #sed -i 's/#define BOARD_GPIO_LED_WIFI_INV.*/#define BOARD_GPIO_LED_WIFI_INV     0/' $TARGET_H
        
        sed -i 's/#define BOARD_GPIO_BTN_RESET.*/#define BOARD_GPIO_BTN_RESET        13/' $TARGET_H
        sed -i 's/#define BOARD_GPIO_BTN_RESET_INV.*/#define BOARD_GPIO_BTN_RESET_INV    1/' $TARGET_H

        echo "=== АКТИВАЦИЯ ЗАВОДСКОГО USB LED НА GPIO15 ==="
        # Удаляем старый #undef или #define для USB LED
        sed -i '/BOARD_GPIO_LED_USB/d' $TARGET_H
        
        # Прописываем включение официального светодиода USB на 15 пин с инверсией
        #echo "#define BOARD_GPIO_LED_USB          15" >> $TARGET_H
        #echo "#define BOARD_GPIO_LED_USB          64" >> $TARGET_H
        echo "#define BOARD_GPIO_LED_USB_INV      1" >> $TARGET_H

        echo "=== Настройка свитча ==="
        sed -i 's/BOARD_SINGLE_EPHY.*/BOARD_SINGLE_EPHY=y/g' $TARGET_MK
        sed -i 's/BOARD_EPHY_PORT_5.*/BOARD_EPHY_PORT_5=n/g' $TARGET_MK
        echo "BOARD_EPHY_GPIO_EN=y" >> $TARGET_MK
        echo "BOARD_EPHY_LED_MODE=15" >> $TARGET_MK

        echo "=== Защита от сброса (Фикс однопортового режима) ==="
        DEFAULTS_H="user/shared/defaults.h"
        if [ -f "$DEFAULTS_H" ]; then
          sed -i 's/{ "rt_mode", "0" }/{ "rt_mode", "1" }/g' $DEFAULTS_H
        fi

        # echo "=== Сборка ==="
        # ./clear_tree.sh
        # ./build_firmware.sh

        echo "=== Сборка ==="
        ./build_firmware.sh
        
        echo "=== Переименование готового файла прошивки ==="
        #rename 's/WT3020H16M/BS-U35-WF/' images/*.trx
        # Используем стандартный mv вместо утилиты rename
        cd images && mv WT3020H16M*.trx BS-U35-WF.trx && cd ..
        
        FW_FILE_NAME="$(find images -type f -regextype posix-extended -iregex ".*\.(trx|bin)$" -printf "%T@\t%f\n" | sort -V | tail -1 | cut -f2)"
        [[ -n $FW_FILE_NAME ]] || { echo "Firmware file not found"; exit 1; }
        echo "FW_FILE_NAME=$FW_FILE_NAME" >> $GITHUB_ENV

    - name: Run custom post-build script
      run: '[[ -f post-build.sh ]] && . post-build.sh || :'

    - name: Prepare artifacts
      run: |
        cp "padavan-ng/trunk/images/$FW_FILE_NAME" .
        echo "BUILD_TIMESTAMP=$(date '+%Y.%m.%d_%H.%M.%S')" >> $GITHUB_ENV

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: padavan-ng_${{ env.CONFIG_VENDOR }}_${{ env.CONFIG_FIRMWARE_PRODUCT_ID }}_${{ env.BUILD_TIMESTAMP }}
        retention-days: 7
        path: |
          ${{ env.FW_FILE_NAME }}
          build.config

    - name: Check firmware size
      run: |
        partitions=padavan-ng/trunk/configs/boards/$CONFIG_VENDOR/$CONFIG_FIRMWARE_PRODUCT_ID/partitions.config
        max_fw_size="$(awk '/Firmware/ { getline; getline; sub(",", ""); print strtonum($2); }' "$partitions")"
        fw_size="$(stat -c %s "$FW_FILE_NAME")"

        if ((fw_size > max_fw_size)); then
          fw_size_fmtd="$(numfmt --grouping "$fw_size") bytes"
          max_fw_size_fmtd="$(numfmt --grouping "$max_fw_size") bytes"
          echo "Firmware size ($fw_size_fmtd) exceeds max size ($max_fw_size_fmtd) for your target device"
          exit 1
        fi
