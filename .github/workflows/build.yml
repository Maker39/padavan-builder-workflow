name: Build firmware

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.gitlab.com/hadzhioglu/padavan-ng
    defaults: { run: { shell: bash } }
    steps:
    - uses: actions/checkout@v4

    - name: Get variables
      run: |
        sed -i 's|\r$||g' variables build.config
        . <(cat variables build.config)
        PADAVAN_THEMES="${PADAVAN_THEMES[*]}"
        for v in "${!PADAVAN_@}" "${!CONFIG_@}"; do
          echo "$v=${!v}" >> $GITHUB_ENV
        done

    - name: Download sources and toolchain
      run: |
        git config --global --add safe.directory '*'
        git clone -b "$PADAVAN_BRANCH" "$PADAVAN_REPO"
        git -C padavan-ng checkout "$PADAVAN_COMMIT"
        wget -qO- "$PADAVAN_TOOLCHAIN_URL" | tar -C padavan-ng --zstd -xf -

    - name: Install themes
      run: |
        if [[ -n $PADAVAN_THEMES ]]; then
          git clone --depth 1 -b "$PADAVAN_THEMES_BRANCH" "$PADAVAN_THEMES_REPO" themes
          cp -r themes/common-theme themes/jquery.js padavan-ng/trunk/user/www/n56u_ribbon_fixed

          for theme in $PADAVAN_THEMES; do
            echo "Installing $theme theme"
            cp -r "themes/$theme-theme" padavan-ng/trunk/user/www/n56u_ribbon_fixed
          done
        fi

    - name: Run custom pre-build script
      run: '[[ -f pre-build.sh ]] && . pre-build.sh || :'

#    - name: Build firmware
#      run: |
#        # 1. Сначала копируем базовый шаблон конфигурации, если он есть
#        cp build.config padavan-ng/trunk/.config
#    
#        # 2. ПРИНУДИТЕЛЬНО записываем правильные переменные путей в конец .config
#        echo "FIRMWARE_VENDOR=NEXX" >> padavan-ng/trunk/.config
#        echo "FIRMWARE_PRODUCT_ID=WT3020H" >> padavan-ng/trunk/.config
#        
#        # 3. Переходим в директорию и собираем
#        cd padavan-ng/trunk
#        ./clear_tree.sh
#        ./build_firmware.sh
#    
#        # 4. Поиск готового файла
#        FW_FILE_NAME="$(find images -type f -regextype posix-extended -iregex ".*\.(trx|bin)$" -printf "%T@\t%f\n" | sort -V | tail -1 | cut -f2)"
#        [[ -n $FW_FILE_NAME ]] || { echo "Firmware file not found"; exit 1; }
#        echo "FW_FILE_NAME=$FW_FILE_NAME" >> $GITHUB_ENV
#    
    - name: Build firmware
      run: |
        # 1. Копируем ваш базовый рабочий конфиг (шаблон)
        cp build.config padavan-ng/trunk/.config
    
        # 2. Переходим в рабочую папку проекта
        cd padavan-ng/trunk
    
        # 3. КРИТИЧЕСКИЙ ШАГ: Внедряем патч С-кода платформы Ralink внутрь скрипта сборки
        # Как только ядро извлечется, скрипт перепишет аппаратные дефайны памяти с 64МБ на 128МБ
        cat << 'EOF' > patch_ram.sh
        #!/bin/bash
        if [ -d "linux/linux-3.4.x" ]; then
          echo "=== ПАТЧИМ ИСХОДНЫЙ КОД ЯДРА ПОД 128MB RAM ==="
          # 1. Форсируем размер в заголовочных файлах платформы MediaTek/Ralink
          find linux/linux-3.4.x/arch/mips/include/asm/mach-ralink/ -type f -name "*.h" -exec sed -i 's/CONFIG_RALINK_RAM_SIZE=64/CONFIG_RALINK_RAM_SIZE=128/g' {} +
          find linux/linux-3.4.x/arch/mips/ralink/ -type f -name "*.c" -exec sed -i 's/sys_mem_size = 64/sys_mem_size = 128/g' {} +
      
          # 2. Обходим аппаратное ограничение детекции шины для MT7620N (Force 128M)
          find linux/linux-3.4.x/arch/mips/ralink/ -type f -name "*.c" -exec sed -i 's/#define CONFIG_RALINK_RAM_SIZE.*/#define CONFIG_RALINK_RAM_SIZE 128/g' {} +
      
          # 3. Перезаписываем финальный рабочий конфиг ядра, генерируемый Padavan
          if [ -f "linux/linux-3.4.x/.config" ]; then
            sed -i 's/CONFIG_RT2880_DRAM_64M=y/CONFIG_RT2880_DRAM_64M=n/g' linux/linux-3.4.x/.config
            sed -i 's/CONFIG_RT2880_DRAM_128M=n/CONFIG_RT2880_DRAM_128M=y/g' linux/linux-3.4.x/.config
            sed -i 's/CONFIG_RALINK_RAM_SIZE=64/CONFIG_RALINK_RAM_SIZE=128/g' linux/linux-3.4.x/.config
          fi
        fi
        EOF
        chmod +x patch_ram.sh

        # Инжектируем вызов нашего патча в build_firmware.sh ПЕРЕД началом компиляции (build_kernel)
        sed -i '/build_kernel()/a \    ./patch_ram.sh' build_firmware.sh
        # Также вызываем его сразу после генерации oldconfig
        sed -i '/make -C $(LINUX_DIR) oldconfig/a \	./patch_ram.sh' build_firmware.sh

        # 4. Очищаем дерево сборки и запускаем компиляцию
        ./clear_tree.sh
        ./build_firmware.sh
    
        # 5. Поиск готового файла
        cd ../..
        FW_FILE_NAME="$(find padavan-ng/trunk/images -type f -regextype posix-extended -iregex ".*\.(trx|bin)$" -printf "%T@\t%f\n" | sort -V | tail -1 | cut -f2)"
        [[ -n $FW_FILE_NAME ]] || { echo "Firmware file not found"; exit 1; }
        echo "FW_FILE_NAME=$FW_FILE_NAME" >> $GITHUB_ENV

    - name: Run custom post-build script
      run: '[[ -f post-build.sh ]] && . post-build.sh || :'

    - name: Prepare artifacts
      run: |
        cp "padavan-ng/trunk/images/$FW_FILE_NAME" .
        echo "BUILD_TIMESTAMP=$(date '+%Y.%m.%d_%H.%M.%S')" >> $GITHUB_ENV

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: padavan-ng_${{ env.CONFIG_VENDOR }}_${{ env.CONFIG_FIRMWARE_PRODUCT_ID }}_${{ env.BUILD_TIMESTAMP }}
        retention-days: 7
        path: |
          ${{ env.FW_FILE_NAME }}
          build.config

    - name: Check firmware size
      run: |
        partitions=padavan-ng/trunk/configs/boards/$CONFIG_VENDOR/$CONFIG_FIRMWARE_PRODUCT_ID/partitions.config
        max_fw_size="$(awk '/Firmware/ { getline; getline; sub(",", ""); print strtonum($2); }' "$partitions")"
        fw_size="$(stat -c %s "$FW_FILE_NAME")"

        if ((fw_size > max_fw_size)); then
          fw_size_fmtd="$(numfmt --grouping "$fw_size") bytes"
          max_fw_size_fmtd="$(numfmt --grouping "$max_fw_size") bytes"
          echo "Firmware size ($fw_size_fmtd) exceeds max size ($max_fw_size_fmtd) for your target device"
          exit 1
        fi
