name: Build firmware

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.gitlab.com/hadzhioglu/padavan-ng
    defaults: { run: { shell: bash } }
    steps:
    - uses: actions/checkout@v4

    - name: Get variables
      run: |
        sed -i 's|\r$||g' variables build.config
        . <(cat variables build.config)
        PADAVAN_THEMES="${PADAVAN_THEMES[*]}"
        for v in "${!PADAVAN_@}" "${!CONFIG_@}"; do
          echo "$v=${!v}" >> $GITHUB_ENV
        done

    - name: Download sources and toolchain
      run: |
        git config --global --add safe.directory '*'
        git clone -b "$PADAVAN_BRANCH" "$PADAVAN_REPO"
        git -C padavan-ng checkout "$PADAVAN_COMMIT"
        wget -qO- "$PADAVAN_TOOLCHAIN_URL" | tar -C padavan-ng --zstd -xf -

    - name: Install themes
      run: |
        if [[ -n $PADAVAN_THEMES ]]; then
          git clone --depth 1 -b "$PADAVAN_THEMES_BRANCH" "$PADAVAN_THEMES_REPO" themes
          cp -r themes/common-theme themes/jquery.js padavan-ng/trunk/user/www/n56u_ribbon_fixed

          for theme in $PADAVAN_THEMES; do
            echo "Installing $theme theme"
            cp -r "themes/$theme-theme" padavan-ng/trunk/user/www/n56u_ribbon_fixed
          done
        fi

    - name: Run custom pre-build script
      run: '[[ -f pre-build.sh ]] && . pre-build.sh || :'

#  AI (рабочий вариант)
# Включение автоопределения памяти (как в OpenWrt)
# Мы модифицируем исходный код Kconfig и конфигурационные файлы платы WT3020H16M до сборки,
# заставляя ядро Padavan доверять загрузчику Breed.
    - name: Build firmware
      run: |
        # 1. Принудительно очищаем кавычки в build.config
        sed -i 's/"//g' build.config
        
        # 2. Копируем базовый конфиг платы в рабочую папку
        cp build.config padavan-ng/trunk/.config
        
        # 3. Переходим в рабочую директорию проекта
        cd padavan-ng/trunk
        #####

        # 4. ПОДХОД OPENWRT: Меняем логику памяти БЕЗ опасных глобальных команд find
        BOARD_DIR="configs/boards/NEXX/WT3020H16M"
         
        # Точечно правим конфигурацию ядра по фиксированному пути
        sed -i 's/CONFIG_RALINK_RAM_SIZE=64/# CONFIG_RALINK_RAM_SIZE is not set/g' $BOARD_DIR/kernel-3.4.x.config
        sed -i 's/CONFIG_RALINK_RAM_SIZE_FROM_BOOTLOADER=n/CONFIG_RALINK_RAM_SIZE_FROM_BOOTLOADER=y/g' $BOARD_DIR/kernel-3.4.x.config
        sed -i 's/CONFIG_RT2880_DRAM_64M=y/CONFIG_RT2880_DRAM_64M=n\nCONFIG_RT2880_DRAM_128M=y/g' $BOARD_DIR/kernel-3.4.x.config
        
        # Прямая хирургическая правка файлов разметки вместо слепого поиска по всей системе
        sed -i 's/DRAM_64M/DRAM_128M/g' $BOARD_DIR/board.h
        sed -i 's/RAM_SIZE=64/RAM_SIZE=128/g' $BOARD_DIR/board.mk
        
        # === НАШИ КОРРЕКТНЫЕ ПРАВКИ LED И КНОПОК ДЛЯ KIMAX ===
        TARGET_H="configs/boards/NEXX/WT3020H16M/board.h"
        TARGET_MK="configs/boards/NEXX/WT3020H16M/board.mk"
        
        TARGET_H="configs/boards/NEXX/WT3020H16M/board.h"
        TARGET_MK="configs/boards/NEXX/WT3020H16M/board.mk"
        
        echo "=== Модификация board.h для Kimax ==="
        sed -i 's/#define BOARD_NAME.*/#define BOARD_NAME "BS-U35-WF"/' $TARGET_H
        sed -i 's/#define BOARD_GPIO_LED_LAN.*/#define BOARD_GPIO_LED_LAN          44/' $TARGET_H
        sed -i 's/#define BOARD_GPIO_LED_LAN_INV.*/#define BOARD_GPIO_LED_LAN_INV      1/' $TARGET_H
        sed -i 's/#define BOARD_GPIO_BTN_RESET.*/#define BOARD_GPIO_BTN_RESET        13/' $TARGET_H
        sed -i 's/#define BOARD_GPIO_BTN_RESET_INV.*/#define BOARD_GPIO_BTN_RESET_INV    1/' $TARGET_H
        
        echo "=== Активация GPIO2/NAND через board.mk ==="
        echo "BOARD_SINGLE_EPHY=y" >> $TARGET_MK
        echo "BOARD_EPHY_PORT_5=n" >> $TARGET_MK
      
        # КРИТИЧЕСКИЙ ФИКС: Убираем запуск ./clear_tree.sh, который затирал файлы BusyBox 
        # и приводил к циклическому "Error 2" на современных хостах Ubuntu.
        
        echo "=== Запуск сборки прошивки ==="
        ./build_firmware.sh

      
        
        # 7. Поиск готового файла прошивки
        FW_FILE_NAME="$(find images -type f -regextype posix-extended -iregex ".*\.(trx|bin)$" -printf "%T@\t%f\n" | sort -V | tail -1 | cut -f2)"
        [[ -n $FW_FILE_NAME ]] || { echo "Firmware file not found"; exit 1; }
        echo "FW_FILE_NAME=$FW_FILE_NAME" >> $GITHUB_ENV
        
