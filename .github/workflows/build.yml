name: Build firmware

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.gitlab.com/hadzhioglu/padavan-ng
    defaults: { run: { shell: bash } }
    steps:
    - uses: actions/checkout@v4

    - name: Get variables
      run: |
        sed -i 's|\r$||g' variables build.config
        . <(cat variables build.config)
        PADAVAN_THEMES="${PADAVAN_THEMES[*]}"
        for v in "${!PADAVAN_@}" "${!CONFIG_@}"; do
          echo "$v=${!v}" >> $GITHUB_ENV
        done

    - name: Download sources and toolchain
      run: |
        git config --global --add safe.directory '*'
        git clone -b "$PADAVAN_BRANCH" "$PADAVAN_REPO"
        git -C padavan-ng checkout "$PADAVAN_COMMIT"
        wget -qO- "$PADAVAN_TOOLCHAIN_URL" | tar -C padavan-ng --zstd -xf -

    - name: Install themes
      run: |
        if [[ -n $PADAVAN_THEMES ]]; then
          git clone --depth 1 -b "$PADAVAN_THEMES_BRANCH" "$PADAVAN_THEMES_REPO" themes
          cp -r themes/common-theme themes/jquery.js padavan-ng/trunk/user/www/n56u_ribbon_fixed

          for theme in $PADAVAN_THEMES; do
            echo "Installing $theme theme"
            cp -r "themes/$theme-theme" padavan-ng/trunk/user/www/n56u_ribbon_fixed
          done
        fi

    - name: Run custom pre-build script
      run: '[[ -f pre-build.sh ]] && . pre-build.sh || :'

#    - name: Build firmware
#      run: |
#        # 1. Сначала копируем базовый шаблон конфигурации, если он есть
#        cp build.config padavan-ng/trunk/.config
#    
#        # 2. ПРИНУДИТЕЛЬНО записываем правильные переменные путей в конец .config
#        echo "FIRMWARE_VENDOR=NEXX" >> padavan-ng/trunk/.config
#        echo "FIRMWARE_PRODUCT_ID=WT3020H" >> padavan-ng/trunk/.config
#        
#        # 3. Переходим в директорию и собираем
#        cd padavan-ng/trunk
#        ./clear_tree.sh
#        ./build_firmware.sh
#    
#        # 4. Поиск готового файла
#        FW_FILE_NAME="$(find images -type f -regextype posix-extended -iregex ".*\.(trx|bin)$" -printf "%T@\t%f\n" | sort -V | tail -1 | cut -f2)"
#        [[ -n $FW_FILE_NAME ]] || { echo "Firmware file not found"; exit 1; }
#        echo "FW_FILE_NAME=$FW_FILE_NAME" >> $GITHUB_ENV
#    
    - name: Build firmware
      run: |
        # 1. Принудительно очищаем кавычки в build.config, если они там остались
        sed -i 's/"//g' build.config
        
        # 2. Копируем ваш базовый рабочий конфиг платы (шаблон)
        cp build.config padavan-ng/trunk/.config
        
        # 3. Переходим в рабочую папку проекта
        cd padavan-ng/trunk
        
        # 4. Создаем официальный патч ядра для структуры Padavan-NG
        # Теперь мы бьем точно в цель — в файлы папки WT3020H16M!
        mkdir -p user/kernel-3.4.x
        cat << 'EOF' > user/kernel-3.4.x/099-force-128m-ram.patch
        --- a/arch/mips/ralink/Kconfig
        +++ b/arch/mips/ralink/Kconfig
        @@ -165,7 +165,7 @@
         
         config RALINK_RAM_SIZE
          int "RAM Size (MB)"
        -	default 64
        +	default 128
          help
            Please specify the RAM size in MB.
         
        --- a/configs/boards/NEXX/WT3020H16M/kernel-3.4.x.config
        +++ b/configs/boards/NEXX/WT3020H16M/kernel-3.4.x.config
        @@ -140,3 +140,3 @@
        -CONFIG_RT2880_DRAM_64M=y
        -# CONFIG_RT2880_DRAM_128M is not set
        -CONFIG_RALINK_RAM_SIZE=64
        +CONFIG_RT2880_DRAM_64M=n
        +CONFIG_RT2880_DRAM_128M=y
        +CONFIG_RALINK_RAM_SIZE=128
         EOF
    
        # Дублируем патч в нижнем и верхнем регистре (на случай разной структуры папок форка)
        mkdir -p configs/boards/NEXX/WT3020H16M/patches/ || true
        mkdir -p configs/boards/nexx/wt3020h16m/patches/ || true
        cp user/kernel-3.4.x/099-force-128m-ram.patch configs/boards/NEXX/WT3020H16M/patches/ || true
        cp user/kernel-3.4.x/099-force-128m-ram.patch configs/boards/nexx/wt3020h16m/patches/ || true
    
        # 5. Очищаем дерево сборки и запускаем компиляцию
        ./clear_tree.sh
        ./build_firmware.sh
        
        # 6. Находим скомпилированный файл, оставаясь внутри папки trunk
        FW_FILE_NAME="$(find images -type f -regextype posix-extended -iregex ".*\.(trx|bin)$" -printf "%T@\t%f\n" | sort -V | tail -1 | cut -f2)"
        [[ -n $FW_FILE_NAME ]] || { echo "Firmware file not found"; exit 1; }
        echo "FW_FILE_NAME=$FW_FILE_NAME" >> $GITHUB_ENV



    - name: Run custom post-build script
      run: '[[ -f post-build.sh ]] && . post-build.sh || :'

    - name: Prepare artifacts
      run: |
        cp "padavan-ng/trunk/images/$FW_FILE_NAME" .
        echo "BUILD_TIMESTAMP=$(date '+%Y.%m.%d_%H.%M.%S')" >> $GITHUB_ENV

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: padavan-ng_${{ env.CONFIG_VENDOR }}_${{ env.CONFIG_FIRMWARE_PRODUCT_ID }}_${{ env.BUILD_TIMESTAMP }}
        retention-days: 7
        path: |
          ${{ env.FW_FILE_NAME }}
          build.config

    - name: Check firmware size
      run: |
        partitions=padavan-ng/trunk/configs/boards/$CONFIG_VENDOR/$CONFIG_FIRMWARE_PRODUCT_ID/partitions.config
        max_fw_size="$(awk '/Firmware/ { getline; getline; sub(",", ""); print strtonum($2); }' "$partitions")"
        fw_size="$(stat -c %s "$FW_FILE_NAME")"

        if ((fw_size > max_fw_size)); then
          fw_size_fmtd="$(numfmt --grouping "$fw_size") bytes"
          max_fw_size_fmtd="$(numfmt --grouping "$max_fw_size") bytes"
          echo "Firmware size ($fw_size_fmtd) exceeds max size ($max_fw_size_fmtd) for your target device"
          exit 1
        fi
