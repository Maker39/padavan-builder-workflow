#  AI (рабочий вариант)
# Включение автоопределения памяти (как в OpenWrt)
# Мы модифицируем исходный код Kconfig и конфигурационные файлы платы WT3020H16M до сборки,
# заставляя ядро Padavan доверять загрузчику Breed.
    - name: Build firmware
      run: |
        # 1. Принудительно очищаем кавычки в build.config
        sed -i 's/"//g' build.config
        
        # 2. Копируем базовый конфиг платы в рабочую папку
        cp build.config padavan-ng/trunk/.config
        
        # 3. Переходим в рабочую директорию проекта
        cd padavan-ng/trunk
        echo "=== Модификация board.h под Kimax BS-U35-WF ==="
        sed -i 's/#define BOARD_NAME.*/#define BOARD_NAME "BS-U35-WF"/' configs/boards/NEXX/WT3020H16M/board.h
        sed -i 's/#define BOARD_DESC.*/#define BOARD_DESC "Blueendless Kimax Wi-Fi HDD"/' configs/boards/NEXX/WT3020H16M/board.h
        sed -i 's/#define BOARD_GPIO_BTN_RESET.*/#define BOARD_GPIO_BTN_RESET 13/' configs/boards/NEXX/WT3020H16M/board.h
        sed -i 's/#define BOARD_GPIO_BTN_WPS.*/#undef  BOARD_GPIO_BTN_WPS/' configs/boards/NEXX/WT3020H16M/board.h
        sed -i 's/#define BOARD_GPIO_LED_POWER.*/#define BOARD_GPIO_LED_POWER 14/' configs/boards/NEXX/WT3020H16M/board.h
        sed -i 's/#define BOARD_GPIO_LED_WIFI.*/#define BOARD_GPIO_LED_WIFI 7/' configs/boards/NEXX/WT3020H16M/board.h
        sed -i 's/#define BOARD_GPIO_LED_SATA.*/#define BOARD_GPIO_LED_SATA 15/' configs/boards/NEXX/WT3020H16M/board.h
  # #define BOARD_GPIO_LED_WIFI	7   /* Синий WiFi LED на GPIO 7 */
  # #define BOARD_GPIO_LED_POWER	14  /* Зеленый LAN LED на GPIO 14 (как системный) */
  # #define BOARD_GPIO_LED_SATA	15  /* Красный/Оранжевый HDD LED на GPIO 15 */

  # /* Инверсия (Active Low) */
  # #define BOARD_GPIO_LED_INVERTED
  # #define BOARD_GPIO_BTN_INVERTED
 
        
        # 4. ПОДХОД OPENWRT: Меняем логику инициализации памяти во всех файлах платы WT3020H16M
        # Переводим сборщик в режим автоопределения RAM из загрузчика (Breed)
        BOARD_DIR="configs/boards/NEXX/WT3020H16M"
         
        # Правим конфигурацию ядра (Включаем чтение из Bootloader и отключаем жесткий лимит)
        sed -i 's/CONFIG_RALINK_RAM_SIZE=64/# CONFIG_RALINK_RAM_SIZE is not set/g' $BOARD_DIR/kernel-3.4.x.config
        sed -i 's/CONFIG_RALINK_RAM_SIZE_FROM_BOOTLOADER=n/CONFIG_RALINK_RAM_SIZE_FROM_BOOTLOADER=y/g' $BOARD_DIR/kernel-3.4.x.config
        sed -i 's/CONFIG_RT2880_DRAM_64M=y/CONFIG_RT2880_DRAM_64M=n\nCONFIG_RT2880_DRAM_128M=y/g' $BOARD_DIR/kernel-3.4.x.config
        
        # КРИТИЧЕСКИЙ ШАГ: Проверяем и правим board.h / board.mk в папке платы
        # Если там жестко зашиты лимиты DRAM_64M, переключаем их на 128M
        find $BOARD_DIR/ -type f -exec sed -i 's/DRAM_64M/DRAM_128M/g' {} +
        find $BOARD_DIR/ -type f -exec sed -i 's/RAM_SIZE=64/RAM_SIZE=128/g' {} +
        
        # 5. ХАК ДЛЯ СБОРОЧНОГО СКРИПТА:
        # Заставляем Kconfig ядра по умолчанию всегда выбирать размер памяти из загрузчика
        sed -i '/build_kernel()/a \    echo "=== АКТИВИРУЕМ АВТООПРЕДЕЛЕНИЕ RAM ==="\n    find linux/linux-3.4.x/arch/mips/ralink/ -name "Kconfig" -exec sed -i "s/config RALINK_RAM_SIZE_FROM_BOOTLOADER/config RALINK_RAM_SIZE_FROM_BOOTLOADER\\n\\tbool\\n\\tdefault y\\n\\tconfig DISABLED_BOOTLOADER/g" {} +' build_firmware.sh
    
        # 6. Очищаем дерево сборки и запускаем компиляцию
        ./clear_tree.sh
        ./build_firmware.sh
        
        # 7. Поиск готового файла прошивки
        FW_FILE_NAME="$(find images -type f -regextype posix-extended -iregex ".*\.(trx|bin)$" -printf "%T@\t%f\n" | sort -V | tail -1 | cut -f2)"
        [[ -n $FW_FILE_NAME ]] || { echo "Firmware file not found"; exit 1; }
        echo "FW_FILE_NAME=$FW_FILE_NAME" >> $GITHUB_ENV
        
